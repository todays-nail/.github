name: "refactor: 리팩토링"
description: "동작 변화 없이 내부 구조/품질 개선"
title: "refactor: "
body:
  - type: markdown
    attributes:
      value: |
        해커톤용 간단 템플릿입니다.
        `refactor` = 사용자 입장에서는 그대로인데, 내부를 더 안전/깔끔하게 정리.

  - type: dropdown
    id: platform
    attributes:
      label: "대상"
      options:
        - "iOS"
        - "Web"
        - "iOS + Web"
        - "기타"
    validations:
      required: true

  - type: textarea
    id: one_liner
    attributes:
      label: "한 줄 설명"
      placeholder: "예) 예약 화면의 상태 관리를 정리해 수정/버그를 줄인다"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "메모/링크(선택)"
      placeholder: "문제 상황, 참고 링크, 영향 범위"
    validations:
      required: false

